{% extends "base.html" %}
{% block title %}{{ 'Edit offer' if o else 'New offer' }}{% endblock %}
{% block content %}
<div class="card" style="max-width:720px">
  <h1>{{ 'Edit offer' if o else 'New offer' }}</h1>
  <form method="post">
    <div class="field"><label>Offer name (printed on the bill)</label><input type="text" name="name" value="{{ o.name if o }}" required placeholder="e.g. Diwali 10% off on oil"></div>
    <div class="field"><label>Type</label>
      <select name="type" id="type" onchange="show()">{% for k, v in OFFER_TYPES.items() %}<option value="{{ k }}" {{ 'selected' if o and o.type==k }}>{{ v }}</option>{% endfor %}</select></div>

    <div class="field f-product"><label>Product</label>
      <div class="search-box">
        <input type="text" id="psearch" placeholder="Type product name..." autocomplete="off" value="{{ o.product_name if o and o.product_name }}">
        <input type="hidden" name="product_id" id="product_id" value="{{ o.product_id if o and o.product_id }}">
        <div class="suggest" id="suggest" style="display:none"></div>
      </div></div>
    <div class="field f-category"><label>Category</label>
      <select name="category_id"><option value="">-- choose --</option>{% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if o and o.category_id==c.id }}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="row">
      <div class="field f-pct"><label>Percent off</label><input type="number" step="0.01" min="0" max="100" name="value" id="value" value="{{ o.value if o }}"></div>
      <div class="field f-buy"><label>Buy quantity</label><input type="number" step="0.001" min="0" name="buy_qty" value="{{ o.buy_qty if o and o.buy_qty }}"></div>
      <div class="field f-buy"><label>Free quantity</label><input type="number" step="0.001" min="0" name="free_qty" value="{{ o.free_qty if o and o.free_qty }}"></div>
      <div class="field f-bill"><label>Bill must be at least &#8377;</label><input type="number" step="0.01" min="0" name="min_bill" value="{{ o.min_bill if o }}"></div>
    </div>
    <div class="row">
      <div class="field"><label>From</label><input type="date" name="from_date" value="{{ o.from_date if o else today }}" required></div>
      <div class="field"><label>To</label><input type="date" name="to_date" value="{{ o.to_date if o else today }}" required></div>
      {% if current_user.role == 'admin' %}
      <div class="field"><label>Branch</label><select name="branch_id"><option value="">All branches</option>{% for b in branches_list %}<option value="{{ b.id }}" {{ 'selected' if o and o.branch_id==b.id }}>{{ b.name }}</option>{% endfor %}</select></div>
      {% else %}<div class="field"><label>Branch</label><input type="text" value="{{ current_branch.name }}" disabled></div>{% endif %}
    </div>
    <div class="field"><label class="checkbox"><input type="checkbox" name="active" value="1" {{ 'checked' if (not o) or o.active }}> Active</label></div>
    <p class="hint" id="help"></p>
    <button class="btn">Save offer</button> <a href="{{ url_for('offers') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const labels = { product_pct: ['Percent off', 'e.g. 10 means 10% off this product'], product_price: ['Special price ₹ per unit', 'Customer pays this price instead of the normal selling price'],
  buy_x_get_y: ['', 'e.g. buy 2 get 1 free: for every 3 units, 1 is free'], category_pct: ['Percent off', 'Applies to every product in the category'],
  bill_pct: ['Percent off the bill', 'e.g. 5% off when the bill is above the amount'], bill_flat: ['Amount off the bill ₹', 'e.g. ₹50 off when the bill is above the amount'] };
function show() {
  const t = document.getElementById('type').value;
  const on = (cls, v) => document.querySelectorAll(cls).forEach(e => e.style.display = v ? '' : 'none');
  on('.f-product', ['product_pct', 'product_price', 'buy_x_get_y'].includes(t));
  on('.f-category', t === 'category_pct');
  on('.f-pct', t !== 'buy_x_get_y');
  on('.f-buy', t === 'buy_x_get_y');
  on('.f-bill', t === 'bill_pct' || t === 'bill_flat');
  document.querySelector('.f-pct label').textContent = labels[t][0] || 'Value';
  document.getElementById('value').max = (t === 'product_pct' || t === 'category_pct' || t === 'bill_pct') ? 100 : '';
  document.getElementById('help').textContent = labels[t][1];
}
show();
const ps = document.getElementById('psearch'), sug = document.getElementById('suggest'), pid = document.getElementById('product_id');
let timer, results = [], sel = -1;
ps.addEventListener('input', () => { pid.value = ''; clearTimeout(timer); timer = setTimeout(async () => {
  const v = ps.value.trim(); if (!v) { sug.style.display = 'none'; return; }
  results = await (await fetch('/api/products/search?q=' + encodeURIComponent(v))).json(); sel = results.length ? 0 : -1; paint(); }, 150); });
ps.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, results.length - 1); paint(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); paint(); e.preventDefault(); }
  else if (e.key === 'Enter') { if (results[sel]) pick(results[sel]); e.preventDefault(); }
});
function paint() { sug.innerHTML = results.map((p, i) => `<div class="${i===sel?'sel':''}" onmousedown="pick(results[${i}])"><span>${p.name}</span><span class="meta">₹${p.selling_price} / ${p.unit}</span></div>`).join('') || '<div class="meta">No match</div>'; sug.style.display = 'block'; }
function pick(p) { pid.value = p.id; ps.value = p.name; sug.style.display = 'none'; }
document.addEventListener('click', e => { if (!e.target.closest('.search-box')) sug.style.display = 'none'; });
</script>
{% endblock %}
