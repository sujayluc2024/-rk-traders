{% extends "base.html" %}
{% block title %}Login - {{ settings.shop_name }}{% endblock %}
{% block container_class %}login-wrap{% endblock %}
{% block content %}
<div class="login-box">
  <img src="{{ url_for('static', filename='logo.svg') }}" alt="{{ settings.shop_name }}" class="login-logo">
  <form method="post">
    <div class="field"><label>Username</label><input type="text" name="username" required autofocus></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <button class="btn btn-lg">Login</button>
  </form>
</div>
{% endblock %}
