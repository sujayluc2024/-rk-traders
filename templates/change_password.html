{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:30px auto">
  <h1>Change password</h1>
  <form method="post">
    <div class="field"><label>Current password</label><input type="password" name="old" required></div>
    <div class="field"><label>New password</label><input type="password" name="new" required minlength="4"></div>
    <div class="field"><label>Confirm new password</label><input type="password" name="confirm" required minlength="4"></div>
    <button class="btn">Change</button> <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
  </form>
</div>
{% endblock %}
