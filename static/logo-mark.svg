<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="RK Traders - Radha Krishna">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0b1a4d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#bg)"/>

  <!-- flute (bansuri), behind -->
  <g transform="rotate(-40 50 50)">
    <rect x="20" y="46.6" width="64" height="6.8" rx="3.4" fill="url(#gold)"/>
    <rect x="23" y="46.6" width="2.5" height="6.8" fill="#7c2d12" opacity="0.85"/>
    <rect x="78.5" y="46.6" width="2.5" height="6.8" fill="#7c2d12" opacity="0.85"/>
    <g fill="#451a03">
      <circle cx="40" cy="50" r="1.3"/><circle cx="46.5" cy="50" r="1.3"/><circle cx="53" cy="50" r="1.3"/>
      <circle cx="59.5" cy="50" r="1.3"/><circle cx="66" cy="50" r="1.3"/><circle cx="72.5" cy="50" r="1.3"/>
    </g>
    <path d="M20 50 l-4 5 M20 50 l-5.5 2 M20 50 l-2 6" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- peacock feather (mor pankh) -->
  <g>
    <path d="M46 70 C 40 60, 30 50, 27 41" fill="none" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round"/>
    <g stroke="#34d399" stroke-width="1" stroke-linecap="round" opacity="0.95">
      <path d="M44 66 l-7 -1.5"/><path d="M41 61 l-7 -0.5"/><path d="M38 56 l-7 1"/><path d="M35 51 l-6 2"/><path d="M32 46 l-5 2.5"/>
      <path d="M44 66 l5 -4"/><path d="M41 61 l6 -3.5"/><path d="M38 56 l6 -2"/><path d="M35 51 l6 -1"/><path d="M32 46 l5 0"/>
    </g>
    <g transform="rotate(-14 27 30)">
      <ellipse cx="27" cy="30" rx="9" ry="12.5" fill="#f59e0b"/>
      <ellipse cx="27" cy="30" rx="6.8" ry="9.6" fill="#10b981"/>
      <ellipse cx="27" cy="30.5" rx="4.4" ry="6.4" fill="#1d4ed8"/>
      <ellipse cx="27" cy="31.5" rx="2.4" ry="3.6" fill="#0b1a4d"/>
      <ellipse cx="25" cy="25.5" rx="1.5" ry="2.1" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- RK monogram -->
  <g fill="#ffffff" transform="translate(48 62) scale(0.95)">
    <path d="M0 26 V0 H10.5 C16.5 0 19.5 3 19.5 7.5 C19.5 11 17.5 13.2 14.5 14.2 L20.5 26 H13.5 L8.5 15 H6.5 V26 Z M6.5 5 V10.2 H10 C12.2 10.2 13.3 9.2 13.3 7.6 C13.3 6 12.2 5 10 5 Z"/>
    <path d="M23 26 V0 H29.5 V10 L36 0 H43.5 L35 11.5 L44 26 H36.5 L30.8 16.6 L29.5 18.2 V26 Z"/>
  </g>
</svg>
